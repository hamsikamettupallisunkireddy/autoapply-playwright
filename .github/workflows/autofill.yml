name: AutoFill Job Form
on:
  repository_dispatch:
    types: [autofill]

jobs:
  autofill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd playwright-service
          npm install
          npx playwright install --with-deps chromium

      - name: Run AutoFill
        run: |
          cd playwright-service
          node autofill.js
        env:
          JOB_URL: ${{ github.event.client_payload.url }}
          PROFILE: ${{ toJson(github.event.client_payload.profile) }}